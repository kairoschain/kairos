<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img"
     aria-labelledby="title description">
  <title id="title">Kairos finalized-window live-state expansion</title>
  <desc id="description">
    Eighteen hard-finalized occupancy observations control a one-level state
    expansion. Ten observations at or above seventy-five percent expand the
    exact sparse vector by attaching the existing root to a canonical empty
    subtree. Existing slots do not move.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111522"/>
      <stop offset=".52" stop-color="#0c111c"/>
      <stop offset="1" stop-color="#080b13"/>
    </linearGradient>
    <linearGradient id="cyanPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172632"/>
      <stop offset="1" stop-color="#10151f"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152a23"/>
      <stop offset="1" stop-color="#10151f"/>
    </linearGradient>
    <radialGradient id="sceneGlow">
      <stop offset="0" stop-color="#344866" stop-opacity=".16"/>
      <stop offset=".58" stop-color="#26364f" stop-opacity=".07"/>
      <stop offset="1" stop-color="#090c14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9db2d4"
            stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="18"
                    flood-color="#02040a" flood-opacity=".62"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L11 5.5L0 11Z" fill="#67d7f6"/>
    </marker>
  </defs>

  <rect width="1440" height="760" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="760" rx="24" fill="url(#grid)"/>
  <ellipse cx="720" cy="450" rx="620" ry="330" fill="url(#sceneGlow)"/>

  <g font-family="Inter, Noto Sans, ui-sans-serif, system-ui, sans-serif">
    <text x="56" y="55" fill="#f6f7fa" font-size="21" font-weight="650"
          letter-spacing="2.7">LIVE STATE EXPANSION</text>
    <text x="56" y="85" fill="#9299ad" font-size="14">
      Capacity changes at a deterministic boundary; occupied slots stay exactly where they are.
    </text>
    <text x="1384" y="57" fill="#34e06f" font-size="15" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      Kairos
    </text>

    <!-- finalized window -->
    <rect x="56" y="118" width="1328" height="150" rx="16"
          fill="#111622" stroke="#596078" stroke-opacity=".55"/>
    <text x="80" y="147" fill="#67d7f6" font-size="11" font-weight="700"
          letter-spacing="1.7">HARD-FINALIZED OCCUPANCY WINDOW</text>
    <text x="1360" y="148" fill="#9299ad" font-size="12" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      child of H · observations H−35 … H−18
    </text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="12" text-anchor="middle">
      <g fill="#173d2b" stroke="#34e06f" stroke-opacity=".66">
        <rect x="80"  y="174" width="56" height="50" rx="7"/>
        <rect x="146" y="174" width="56" height="50" rx="7"/>
        <rect x="212" y="174" width="56" height="50" rx="7"/>
        <rect x="278" y="174" width="56" height="50" rx="7"/>
        <rect x="344" y="174" width="56" height="50" rx="7"/>
        <rect x="410" y="174" width="56" height="50" rx="7"/>
        <rect x="476" y="174" width="56" height="50" rx="7"/>
        <rect x="542" y="174" width="56" height="50" rx="7"/>
        <rect x="608" y="174" width="56" height="50" rx="7"/>
        <rect x="674" y="174" width="56" height="50" rx="7"/>
      </g>
      <g fill="#181d2a" stroke="#596078" stroke-opacity=".60">
        <rect x="740"  y="174" width="56" height="50" rx="7"/>
        <rect x="806"  y="174" width="56" height="50" rx="7"/>
        <rect x="872"  y="174" width="56" height="50" rx="7"/>
        <rect x="938"  y="174" width="56" height="50" rx="7"/>
        <rect x="1004" y="174" width="56" height="50" rx="7"/>
        <rect x="1070" y="174" width="56" height="50" rx="7"/>
        <rect x="1136" y="174" width="56" height="50" rx="7"/>
        <rect x="1202" y="174" width="56" height="50" rx="7"/>
      </g>
      <g fill="#69ee96">
        <text x="108" y="204">≥75%</text><text x="174" y="204">≥75%</text>
        <text x="240" y="204">≥75%</text><text x="306" y="204">≥75%</text>
        <text x="372" y="204">≥75%</text><text x="438" y="204">≥75%</text>
        <text x="504" y="204">≥75%</text><text x="570" y="204">≥75%</text>
        <text x="636" y="204">≥75%</text><text x="702" y="204">≥75%</text>
      </g>
      <g fill="#8d94a7">
        <text x="768" y="204">&lt;75%</text><text x="834" y="204">&lt;75%</text>
        <text x="900" y="204">&lt;75%</text><text x="966" y="204">&lt;75%</text>
        <text x="1032" y="204">&lt;75%</text><text x="1098" y="204">&lt;75%</text>
        <text x="1164" y="204">&lt;75%</text><text x="1230" y="204">&lt;75%</text>
      </g>
    </g>
    <rect x="1283" y="174" width="77" height="50" rx="7"
          fill="#11291d" stroke="#34e06f"/>
    <text x="1321.5" y="195" fill="#34e06f" font-size="17"
          font-weight="700" text-anchor="middle">10 / 18</text>
    <text x="1321.5" y="214" fill="#8bdba5" font-size="10"
          text-anchor="middle" letter-spacing=".8">EXPAND</text>

    <!-- current domain -->
    <g filter="url(#shadow)">
      <rect x="56" y="310" width="495" height="354" rx="18"
            fill="url(#cyanPanel)" stroke="#67d7f6" stroke-opacity=".43"/>
    </g>
    <text x="82" y="345" fill="#67d7f6" font-size="11" font-weight="700"
          letter-spacing="1.7">BEFORE · LOG_SLOTS = L</text>
    <text x="82" y="383" fill="#f6f7fa" font-size="25" font-weight="650">
      Exact sparse vector
    </text>
    <text x="82" y="410" fill="#a4aabc" font-size="13">
      2^L addressable slots · 2^16 slots per segment
    </text>

    <g transform="translate(82 448)">
      <g fill="#15202c" stroke="#53647b" stroke-opacity=".75">
        <rect x="0" y="0" width="82" height="54" rx="7"/>
        <rect x="92" y="0" width="82" height="54" rx="7"/>
        <rect x="184" y="0" width="82" height="54" rx="7"/>
        <rect x="276" y="0" width="82" height="54" rx="7"/>
        <rect x="368" y="0" width="20" height="54" rx="7"/>
        <rect x="0" y="64" width="82" height="54" rx="7"/>
        <rect x="92" y="64" width="82" height="54" rx="7"/>
        <rect x="184" y="64" width="82" height="54" rx="7"/>
        <rect x="276" y="64" width="82" height="54" rx="7"/>
        <rect x="368" y="64" width="20" height="54" rx="7"/>
      </g>
      <g fill="#34e06f">
        <rect x="12" y="12" width="58" height="8" rx="3"/>
        <rect x="104" y="12" width="37" height="8" rx="3"/>
        <rect x="196" y="12" width="62" height="8" rx="3"/>
        <rect x="288" y="12" width="46" height="8" rx="3"/>
        <rect x="12" y="76" width="48" height="8" rx="3"/>
        <rect x="104" y="76" width="58" height="8" rx="3"/>
        <rect x="196" y="76" width="42" height="8" rx="3"/>
        <rect x="288" y="76" width="61" height="8" rx="3"/>
      </g>
      <g fill="#273247">
        <rect x="12" y="28" width="33" height="7" rx="3"/>
        <rect x="104" y="28" width="58" height="7" rx="3"/>
        <rect x="196" y="28" width="27" height="7" rx="3"/>
        <rect x="288" y="28" width="58" height="7" rx="3"/>
        <rect x="12" y="92" width="58" height="7" rx="3"/>
        <rect x="104" y="92" width="28" height="7" rx="3"/>
        <rect x="196" y="92" width="58" height="7" rx="3"/>
        <rect x="288" y="92" width="36" height="7" rx="3"/>
      </g>
    </g>
    <rect x="82" y="596" width="443" height="43" rx="8"
          fill="#101722" stroke="#67d7f6" stroke-opacity=".24"/>
    <text x="303.5" y="623" fill="#9cdff0" font-size="13" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      root[L] commits every occupied and empty slot
    </text>

    <!-- transition arrow -->
    <path d="M576 493H714" fill="none" stroke="#67d7f6"
          stroke-width="2.4" marker-end="url(#arrow)"/>
    <circle cx="641" cy="493" r="36" fill="#101722"
            stroke="#67d7f6" stroke-opacity=".52"/>
    <text x="641" y="487" fill="#67d7f6" font-size="23" font-weight="700"
          text-anchor="middle">L+1</text>
    <text x="641" y="508" fill="#8991a5" font-size="9" text-anchor="middle"
          letter-spacing="1.1">ONE LEVEL</text>

    <!-- expanded domain -->
    <g filter="url(#shadow)">
      <rect x="746" y="310" width="638" height="354" rx="18"
            fill="url(#greenPanel)" stroke="#34e06f" stroke-opacity=".43"/>
    </g>
    <text x="772" y="345" fill="#34e06f" font-size="11" font-weight="700"
          letter-spacing="1.7">AFTER · LOG_SLOTS = L + 1</text>
    <text x="772" y="383" fill="#f6f7fa" font-size="25" font-weight="650">
      Root extension, not migration
    </text>
    <text x="772" y="410" fill="#a4aabc" font-size="13">
      The previous vector becomes the left half of a larger exact domain.
    </text>

    <circle cx="1065" cy="455" r="24" fill="#183725" stroke="#34e06f"/>
    <text x="1065" y="460" fill="#83efa7" font-size="12"
          text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      root
    </text>
    <path d="M1052 475L914 520M1078 475L1216 520" fill="none"
          stroke="#657086" stroke-width="2"/>
    <g>
      <rect x="794" y="520" width="241" height="83" rx="12"
            fill="#142733" stroke="#67d7f6" stroke-opacity=".68"/>
      <text x="914.5" y="550" fill="#67d7f6" font-size="12"
            text-anchor="middle" font-weight="700" letter-spacing="1.2">
        EXISTING LEFT SUBTREE
      </text>
      <text x="914.5" y="578" fill="#c5c9d5" font-size="14"
            text-anchor="middle">exact root[L] unchanged</text>
    </g>
    <g>
      <rect x="1095" y="520" width="241" height="83" rx="12"
            fill="#151a25" stroke="#7b8295" stroke-opacity=".58"
            stroke-dasharray="6 5"/>
      <text x="1215.5" y="550" fill="#9ba2b5" font-size="12"
            text-anchor="middle" font-weight="700" letter-spacing="1.2">
        NEW RIGHT SUBTREE
      </text>
      <text x="1215.5" y="578" fill="#858da0" font-size="14"
            text-anchor="middle">canonical empty root[L]</text>
    </g>
    <g font-size="12">
      <circle cx="788" cy="632" r="3" fill="#34e06f"/>
      <text x="800" y="636" fill="#b8bdca">no UTXO moves</text>
      <circle cx="960" cy="632" r="3" fill="#34e06f"/>
      <text x="972" y="636" fill="#b8bdca">slot indices remain valid</text>
      <circle cx="1178" cy="632" r="3" fill="#34e06f"/>
      <text x="1190" y="636" fill="#b8bdca">O(1) root update</text>
    </g>

    <text x="56" y="714" fill="#767f94" font-size="12">
      A 9 / 9 window does not expand. The maximum domain is 2^32 slots.
    </text>
    <text x="1384" y="714" fill="#767f94" font-size="12" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      threshold: 10 of 18 finalized headers
    </text>
  </g>
</svg>
